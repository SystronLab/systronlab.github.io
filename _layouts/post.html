---
layout: default
---
<main id="main-content" class="interior-refresh">
  {% include page-header.html kind='post' back_url='/news' back_label='All news' %}
  <article class="container interior-content reading-width">
    {% if page.background %}<img class="detail-cover" src="{{ page.background | relative_url }}" alt="" fetchpriority="high">{% endif %}
    <div class="prose">{{ content }}</div>
    <nav class="detail-pagination" aria-label="News navigation">
      {% if page.previous.url %}<a href="{{ page.previous.url | relative_url }}">&larr; Older post<span>{{ page.previous.title }}</span></a>{% endif %}
      {% if page.next.url %}<a href="{{ page.next.url | relative_url }}">Newer post &rarr;<span>{{ page.next.title }}</span></a>{% endif %}
    </nav>
  </article>
</main>
