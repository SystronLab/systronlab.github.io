{% assign schema_people = site.people | where_exp: 'person', 'person.former != true' | sort: 'order' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {% for person in schema_people %}
    {% assign person_id = page.url | absolute_url | append: '#person-' | append: person.slug %}
    {
      "@type": "Person",
      "@id": {{ person_id | jsonify }},
      "url": {{ person_id | jsonify }},
      "name": {{ person.name | jsonify | replace: '</', '<\/' }},
      "jobTitle": {{ person.role | jsonify | replace: '</', '<\/' }},
      "memberOf": {
        "@type": "Organization",
        "name": "SYSTRON Lab",
        "url": {{ '/' | absolute_url | jsonify }}
      }{% if person.photo and person.photo != '' and person.photo != '/img/people/placeholder.png' %},
      "image": {{ person.photo | absolute_url | jsonify }}{% endif %}{% if person.site and person.site != '' %},
      "sameAs": [{{ person.site | jsonify | replace: '</', '<\/' }}]{% endif %}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
