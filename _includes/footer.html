<footer class="site-footer">
  <div class="container">
    <div class="footer-logos">
      <img src="{{ '/img/logos/cheddar.png' | relative_url }}" alt="Cheddar Logo" loading="lazy" />
      <img src="{{ '/img/logos/ukri.png' | relative_url }}" alt="UKRI Logo" loading="lazy" />
      <img src="{{ '/img/logos/dsit.png' | relative_url }}" alt="DSIT Logo" loading="lazy" />
      <img src="{{ '/img/logos/uoy.png' | relative_url }}" alt="University of York Logo" loading="lazy" />
    </div>

    <p class="footer-copyright">
      Copyright &copy; SYSTRON Lab {{ 'now' | date: "%Y" }} &middot;
      <a
        href="https://www.york.ac.uk/about/legal-statements/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Legal Statements
      </a>
    </p>

    <div class="footer-links">
      <a
        href="https://github.com/systronlab"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="SYSTRON Lab on GitHub"
      >
        {% include icons/github.svg %}
      </a>

      <a href="mailto:systronlab@gmail.com" aria-label="Email SYSTRON Lab">
        {% include icons/envelope.svg %}
      </a>

      <a
        href="https://www.cs.york.ac.uk"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Department of Computer Science, University of York"
      >
        {% include icons/map-marker-alt.svg %}
      </a>

      <a
        href="https://www.youtube.com/@SYSTRONlab"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Youtube SYSTRON Lab"
      >
        {% include icons/youtube.svg %}
      </a>

      <a
        href="https://uk.linkedin.com/company/systron-lab"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn SYSTRON Lab"
      >
        {% include icons/linkedin.svg %}
      </a>
    </div>
  </div>
</footer>
